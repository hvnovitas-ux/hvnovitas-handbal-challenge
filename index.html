<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧡 HV Novitas Handbal Challenge</title>

    <meta name="theme-color" content="#080808">
    <meta name="description" content="Test jouw handbalkennis met de HV Novitas Handbal Challenge. 30 vragen, drie niveaus en een all-time ranglijst.">
    <link rel="stylesheet" href="style.css?v=20261011-music1">
</head>

<body>

<div class="wrap">

    

    <!-- STARTSCHERM -->
    <div id="startScreen" class="center">

        <div class="hero-badge">DE OFFICIËLE CLUBQUIZ</div>
        <h1>HANDBAL<span>CHALLENGE</span></h1>

        <p class="intro">Test jouw handbalkennis!</p>

        <div class="feature-row"><span>🏆 <strong>30 VRAGEN</strong></span><span>⚡ <strong>3 NIVEAUS</strong></span><span>🥇 <strong>ALL-TIME RANGLIJST</strong></span></div>
        <p class="levels">⭐ Beginner <i>•</i> Gemiddeld <i>•</i> Expert</p>

        <h3 class="slogan">🧡 No Stress, Enjoy!</h3>

        <button id="startButton">
            ▶ START DE QUIZ <span aria-hidden="true">→</span>
        </button>

        <br><br>

        <button id="showLeaderboard">
            🏆 BEKIJK DE ALL-TIME RANGLIJST
        </button>
        <p class="start-note">Klaar voor de uitdaging? Laat zien wat je weet!</p>

    </div>

    <!-- QUIZ -->
    <div id="game" style="display:none;">

        <div class="topbar">

            <div id="status">
                🏆 Score: 0
            </div>

            <div id="vraagnummer">
                Vraag 1 / 30
            </div>

            <div class="music-control"><button type="button" id="musicToggle" aria-pressed="true" title="Achtergrondmuziek aan of uit">♫ Muziek aan</button><input id="musicVolume" type="range" min="0" max="100" value="20" aria-label="Muziekvolume"></div>

        </div>

        <div class="bar">
            <div id="fill"></div>
        </div>

        <div id="quiz"></div>

        <br>

        <button id="next">
            Volgende →
        </button>

    </div>

    <!-- EINDSCHERM -->
    <div id="finishScreen" style="display:none;">

        <div id="finalScore"></div>

        <br>

        <input
            type="text"
            id="playerName"
            placeholder="Jouw naam">

        <br><br>

        <button id="saveScore">
            💾 Score opslaan
        </button>

        <br><br>

        <button id="showLeaderboard2">
            🏆 Bekijk all-time ranglijst
        </button>

        <br><br>

        <button id="backHome">
            🏠 Terug naar start
        </button>

    </div>

    <!-- RANGLIJST -->
    <div id="leaderboard" style="display:none;">

        <h1>🏆 Aller-tijdenranglijst</h1>

        <div id="leaderboardList">

            Nog geen scores.

        </div>

        <br>

        <button id="backHome2">
            🏠 Terug
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<script type="module" src="script.js?v=20261011-alltime"></script>

</body>
</html>
